<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Verification | The xxl</title>
<meta name="robots" content="noindex, nofollow">
<style>
  @font-face { font-family: 'Grand Hotel'; font-style: normal; font-weight: 400; font-display: swap; src: url('grand-hotel.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; color: #fff; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  a { text-decoration: none; color: inherit; }
  header {
    position: sticky; top: 0; z-index: 50;
    background: #000; border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
  }
  .live-link { display: flex; align-items: center; gap: 6px; }
  .live-text { font-size: 15px; font-weight: 600; color: #fff; }
  .live-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: #ff0000; color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 4px 8px; border-radius: 4px;
  }
  .live-dot { width: 7px; height: 7px; background: #fff; border-radius: 50%; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .25; } 100% { opacity: 1; } }
  .brand { font-family: 'Grand Hotel', cursive; font-size: 32px; line-height: 1; background: linear-gradient(90deg, #ff2e63, #ff6a3d, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 10px rgba(255, 46, 99, .55)); }
  .brand-wrap { display: flex; align-items: center; gap: 6px; }
  .drop { font-size: 20px; }
  .mascot { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; display: block; }
  main { max-width: 560px; margin: 0 auto; padding: 60px 20px 40px; text-align: center; }
  h1 { font-size: 28px; margin-bottom: 14px; }
  p { font-size: 16px; line-height: 1.6; color: #ccc; margin-bottom: 28px; }
  .continue {
    display: inline-block;
    background: #ff0000; color: #fff; font-size: 18px; font-weight: 700;
    padding: 14px 44px; border-radius: 999px; border: none; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <a class="live-link" href="https://the-tatoshub.vercel.app/">
    <span class="live-badge"><span class="live-dot"></span>LIVE</span>
    <span class="live-text">Live</span>
  </a>
  <div class="brand-wrap"><div class="brand">The xxl</div><span class="drop">💦</span></div>
  <a href="https://the-tatoshub.vercel.app/">
    <img class="mascot" src="mascot.webp" alt="Trends mascot" width="38" height="38" decoding="async">
  </a>
</header>

<main>
  <h1>Human Verification</h1>
  <p>Please tap Continue to open the site.</p>
  <button class="continue" id="continueBtn">Continue</button>
</main>

<script>
  document.getElementById('continueBtn').addEventListener('click', function () {
    document.cookie = 'human=1; path=/; max-age=86400';
    window.location.href = '/';
  });
</script>

</body>
</html>
